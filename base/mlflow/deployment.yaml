apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-tracking
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-tracking
  template:
    metadata:
      labels:
        app: mlflow-tracking
    spec:
      serviceAccountName: mlflow
      initContainers:
      - name: install-drivers
        image: python:3.10-slim
        command: ["pip", "install", "psycopg2-binary", "--target=/drivers"]
        volumeMounts:
          - name: driver-volume
            mountPath: /drivers
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.11.3
        ports:
        - containerPort: 5000
        command: ["mlflow", "server"]
        args:
        - "--host=0.0.0.0"
        - "--port=5000"
        - "--backend-store-uri=postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@mlflow-db-service:5432/$(POSTGRES_DB)"
        - "--default-artifact-root=s3://mlflow/"
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: POSTGRES_PASSWORD
        - name: PYTHONPATH
          valueFrom:
            configMapKeyRef: 
              name: platform-config
              key: PYTHONPATH
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: MINIO_ROOT_PASSWORD
        - name: MLFLOW_S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: platform-config
              key: MLFLOW_S3_ENDPOINT_URL
        - name: MLFLOW_S3_IGNORE_TLS
          valueFrom: 
            configMapKeyRef: 
              name: platform-config
              key: MLFLOW_S3_IGNORE_TLS 
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: driver-volume
          mountPath: /drivers
      volumes:
      - name: driver-volume
        emptyDir: {}
