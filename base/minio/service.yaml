apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: mlops
spec:
  #type: NodePort
  selector:
    app: minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
      #nodePort: 30900  # commenting since routing is done through ingress controller + /etc/hosts
    - name: console
      port: 9001
      targetPort: 9001
      #nodePort: 30901  # commenting since routing is done through ingress controller + /etc/hosts

