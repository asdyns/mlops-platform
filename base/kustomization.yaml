apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops
resources:
  - namespace
  - storage
  - mlflow-db
  - mlflow
  - minio
  - jupyter
  - ingress
  - dashboard
secretGenerator:
  - name: platform-secrets
    envs:
      - secrets/.env.secrets
configMapGenerator:
  - name: platform-config
    envs:
      - config/.env.config
